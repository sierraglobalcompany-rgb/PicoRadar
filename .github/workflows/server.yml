name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  sqlite:
    name: Laravel gates (PHP ${{ matrix.php }}, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php artisan key:generate --no-interaction

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Build Blade assets
        run: |
          npm ci
          npm run build

      - name: Check migrations
        run: php artisan migrate:fresh --env=testing --no-interaction

      - name: Test
        run: |
          php artisan test
          php artisan route:list

  mariadb:
    name: MariaDB migration compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: picoradar_ci
          MARIADB_USER: picoradar
          MARIADB_PASSWORD: picoradar_ci_password
          MARIADB_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo_mysql, mysqlnd
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify MariaDB migrations and rollback
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: picoradar_ci
          DB_USERNAME: picoradar
          DB_PASSWORD: picoradar_ci_password
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --no-interaction
          php artisan migrate:fresh --force --no-interaction
          php artisan test --configuration=phpunit.mariadb.xml --filter='Dataset(Publisher|Database)Test|GeographyJurisdictionTest|CameraRegistryTest'
          php artisan tinker --execute="\$operator = \App\Models\User::query()->create(['name' => 'CI Operator', 'email' => 'ci-operator@example.test', 'password' => bcrypt(\Illuminate\Support\Str::random(48)), 'role' => \App\Enums\OperatorRole::Admin, 'is_active' => true]); if (\$operator->role !== \App\Enums\OperatorRole::Admin || ! \$operator->isActive()) { throw new \RuntimeException('Operator migration assertion failed.'); }"
          php artisan migrate:rollback --step=1 --force --no-interaction
          php artisan migrate --force --no-interaction
