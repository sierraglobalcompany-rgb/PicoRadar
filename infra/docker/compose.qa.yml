# Local QA only. Start through scripts/run_picoradar_docker_qa.ps1.
# The required project name is UNIQUE for every run, not shared with other apps.
name: ${PICORADAR_QA_PROJECT:?Use isolated PicoRadar launcher}
services:
  db:
    image: mariadb:11.8
    restart: 'no'
    environment:
      MARIADB_DATABASE: picoradar_qa
      MARIADB_USER: picoradar_qa
      MARIADB_PASSWORD: ${PICORADAR_QA_DB_PASSWORD:?Isolated database password missing}
      MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
    tmpfs:
      - /var/lib/mysql:size=536870912
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [qa_private]

  app:
    build:
      context: ../../server
      dockerfile: Dockerfile.qa
    restart: 'no'
    working_dir: /workspace
    environment:
      APP_NAME: PicoRadar-QA-Isolated
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_KEY: ${PICORADAR_QA_APP_KEY:?Isolated app key missing}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: '3306'
      DB_DATABASE: picoradar_qa
      DB_USERNAME: picoradar_qa
      DB_PASSWORD: ${PICORADAR_QA_DB_PASSWORD:?Isolated database password missing}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      TRIPS_ENABLED: 'false'
      PRIVATE_OSRM_ENABLED: 'false'
      CAMPAIGN_PUBLIC_CATALOG_ENABLED: 'false'
      PARTNER_INQUIRIES_ENABLED: 'false'
      PICORADAR_ACCOUNTS_ENABLED: 'false'
      PICORADAR_MARKETING_SEND_ENABLED: 'false'
    networks: [qa_private]
    command: ['php', 'artisan', 'about', '--no-ansi']

networks:
  qa_private:
    internal: true
